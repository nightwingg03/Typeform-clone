name: Keep Render awake

on:
  schedule:
    # Every 10 minutes. Render free tier sleeps after ~15 minutes idle.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping frontend and API
        env:
          FRONTEND_URL: https://typeform-clone-web.onrender.com
        run: |
          ping() {
            url="$1"
            code=$(curl -sS -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 15 --retry-all-errors --max-time 90 "$url" || echo "curl_failed")
            echo "$url -> $code"
          }
          ping "$FRONTEND_URL/"
          ping "$FRONTEND_URL/api/forms"
